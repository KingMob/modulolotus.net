[tools]
node = "22.23.2"
pnpm = "10"

[tasks."build"]
description = "Build the project"
run = "pnpm run build"

[tasks."test"]
description = "Test rendered blog feed excerpts"
run = "node --experimental-strip-types --test src/lib/*.test.ts"

[tasks."dev"]
description = "Run the development server and watch for changes"
run = "pnpm run dev"

[tasks."preview"]
description = "Run the local Wrangler server to see how CloudFlare will display it"
depends = ["build"]
run = "pnpm exec wrangler dev"

[tasks."deploy"]
description = "Deploy the project"
depends = ["build"]
run = "pnpm exec wrangler deploy"
